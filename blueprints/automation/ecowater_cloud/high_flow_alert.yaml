blueprint:
  name: EcoWater Cloud - High Water Flow Alert
  description: >
    Send a notification if continuous water flow exceeds a threshold for a specified duration.
  domain: automation
  author: Andrew Ryder
  homeassistant:
    min_version: 2026.3.0
  input:
    flow_sensor:
      name: Current Water Flow Sensor
      description: The current water flow sensor for your EcoWater device.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: volume_flow_rate
          multiple: false
    flow_threshold:
      name: Flow Rate Threshold (gal/min)
      description: Trigger if flow rate exceeds this GPM threshold.
      default: 5.0
      selector:
        number:
          min: 0.5
          max: 30.0
          step: 0.5
          unit_of_measurement: "gal/min"
          mode: box
    duration:
      name: Duration Threshold
      description: How long flow must continuously exceed the threshold before alerting.
      default: 15
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: "minutes"
          mode: box
    notify_device:
      name: Notification Device
      description: The notify entity to send the alert to.
      selector:
        entity:
          filter:
            - domain: notify
          multiple: false

mode: single
max_exceeded: silent

variables:
  duration_minutes: !input duration

trigger:
  - platform: numeric_state
    entity_id: !input flow_sensor
    above: !input flow_threshold
    for:
      minutes: !input duration

condition: []

action:
  - action: notify.send_message
    target:
      entity_id: !input notify_device
    data:
      title: "EcoWater Cloud: High Water Flow Alert"
      message: >-
        High continuous water flow detected on {{ state_attr(trigger.entity_id, 'friendly_name') or 'EcoWater' }}.
        Current flow is {{ trigger.to_state.state }} gal/min (exceeding {{ trigger.above }} gal/min for over {{ duration_minutes }} minutes).
